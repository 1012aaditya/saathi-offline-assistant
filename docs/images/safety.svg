<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Saathi safety gate">
<title>Saathi safety gate</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f5f66"/></marker></defs>
<rect width="1240" height="640" fill="#ffffff"/>
<text x="620.0" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1d1d1f">Safety: the model never decides anything irreversible</text><text x="620.0" y="66" text-anchor="middle" font-size="14" fill="#5f5f66">Every tap, typing and app switch passes the same deterministic gate (95 Kotlin tests, 1:1 with saathi/safety.py)</text><rect x="60" y="110" width="260" height="90" rx="14" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="190.0" y="144.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1f">Proposed action</text><text x="190.0" y="164.0" text-anchor="middle" font-size="13" fill="#5f5f66">from a rule, GPT, the agent,</text><text x="190.0" y="181.0" text-anchor="middle" font-size="13" fill="#5f5f66">or a scripted task</text><rect x="380" y="110" width="300" height="90" rx="14" fill="#fffbea" stroke="#f1df9a" stroke-width="1.5"/><text x="530.0" y="144.0" text-anchor="middle" font-size="16" font-weight="700" fill="#b8860b">Guide refusals</text><text x="530.0" y="164.0" text-anchor="middle" font-size="13" fill="#5f5f66">private apps · risky words</text><text x="530.0" y="181.0" text-anchor="middle" font-size="13" fill="#5f5f66">(pay, buy, post, subscribe…)</text><rect x="740" y="110" width="440" height="90" rx="14" fill="#fff5f4" stroke="#f2c4bf" stroke-width="1.5"/><text x="960.0" y="144.0" text-anchor="middle" font-size="16" font-weight="700" fill="#b42318">Safety gate</text><text x="960.0" y="164.0" text-anchor="middle" font-size="13" fill="#5f5f66">R1 pay · R2 send · R3 order · R4 verbatim read-back</text><text x="960.0" y="181.0" text-anchor="middle" font-size="13" fill="#5f5f66">R5/R6 payee + ₹ cap · R7–R9 PIN/OTP/CAPTCHA · R10 · R11</text><line x1="320" y1="155" x2="378" y2="155" stroke="#5f5f66" stroke-width="1.8" marker-end="url(#a)"/><line x1="680" y1="155" x2="738" y2="155" stroke="#5f5f66" stroke-width="1.8" marker-end="url(#a)"/><rect x="60" y="300" width="260" height="130" rx="14" fill="#f3f2ff" stroke="#cfcbff" stroke-width="1.5"/><text x="190.0" y="362.5" text-anchor="middle" font-size="16" font-weight="700" fill="#2b22b8">Allow</text><text x="190.0" y="382.5" text-anchor="middle" font-size="13" fill="#5f5f66">do it, then say what changed</text><line x1="960" y1="200" x2="190" y2="298" stroke="#5f5f66" stroke-width="1.8" marker-end="url(#a)"/><rect x="345" y="300" width="260" height="130" rx="14" fill="#fffbea" stroke="#f1df9a" stroke-width="1.5"/><text x="475.0" y="345.5" text-anchor="middle" font-size="16" font-weight="700" fill="#b8860b">Hold</text><text x="475.0" y="365.5" text-anchor="middle" font-size="13" fill="#5f5f66">read back exactly what&#x27;s on screen</text><text x="475.0" y="382.5" text-anchor="middle" font-size="13" fill="#5f5f66">→ Confirm sheet, Cancel is default</text><text x="475.0" y="399.5" text-anchor="middle" font-size="13" fill="#5f5f66">→ only a clear &quot;yes&quot; runs it</text><line x1="960" y1="200" x2="475" y2="298" stroke="#5f5f66" stroke-width="1.8" marker-end="url(#a)"/><rect x="630" y="300" width="260" height="130" rx="14" fill="#fff5f4" stroke="#f2c4bf" stroke-width="1.5"/><text x="760.0" y="362.5" text-anchor="middle" font-size="16" font-weight="700" fill="#b42318">Block</text><text x="760.0" y="382.5" text-anchor="middle" font-size="13" fill="#5f5f66">say why; nothing is pressed</text><line x1="960" y1="200" x2="760" y2="298" stroke="#5f5f66" stroke-width="1.8" marker-end="url(#a)"/><rect x="915" y="300" width="260" height="130" rx="14" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="1045.0" y="354.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1f">Hand over</text><text x="1045.0" y="374.0" text-anchor="middle" font-size="13" fill="#5f5f66">PIN, OTP, CAPTCHA, sign-in, payment page:</text><text x="1045.0" y="391.0" text-anchor="middle" font-size="13" fill="#5f5f66">&quot;your turn&quot; — Saathi stops</text><line x1="960" y1="200" x2="1045" y2="298" stroke="#5f5f66" stroke-width="1.8" marker-end="url(#a)"/><rect x="60" y="480" width="1120" height="110" rx="14" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="620.0" y="515.5" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1f">Also always</text><text x="620.0" y="535.5" text-anchor="middle" font-size="13" fill="#5f5f66">TalkBack is restored · nothing is typed into password fields · the cart never gets more than you asked for</text><text x="620.0" y="552.5" text-anchor="middle" font-size="13" fill="#5f5f66">screen text is never logged · a cancelled send removes its own draft · settings: Allow placing orders is OFF by default</text><text x="620.0" y="569.5" text-anchor="middle" font-size="13" fill="#5f5f66">demo builds only: the laptop bridge (127.0.0.1 via adb) — release builds have no internet permission at all</text>
</svg>