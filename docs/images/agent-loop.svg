<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Do it for me agent loop">
<title>Do it for me agent loop</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f5f66"/></marker></defs>
<rect width="1240" height="600" fill="#ffffff"/>
<text x="620.0" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1d1d1f">&quot;Do it for me&quot; — one step at a time</text><text x="620.0" y="66" text-anchor="middle" font-size="14" fill="#5f5f66">e.g. &quot;YouTube kholo aur lofi song chalao&quot; → typed &quot;lofi&quot;, searched, tapped a Lofi Beats video, playing</text><rect x="50" y="120" width="210" height="150" rx="14" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="155.0" y="175.5" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1f">1 · Look</text><text x="155.0" y="195.5" text-anchor="middle" font-size="13" fill="#5f5f66">read the app&#x27;s screen</text><text x="155.0" y="212.5" text-anchor="middle" font-size="13" fill="#5f5f66">passwords, codes, private</text><text x="155.0" y="229.5" text-anchor="middle" font-size="13" fill="#5f5f66">text left out</text><line x1="260" y1="195" x2="284" y2="195" stroke="#5f5f66" stroke-width="1.8" marker-end="url(#a)"/><rect x="286" y="120" width="210" height="150" rx="14" fill="#f3f2ff" stroke="#cfcbff" stroke-width="1.5"/><text x="391.0" y="175.5" text-anchor="middle" font-size="16" font-weight="700" fill="#2b22b8">2 · Ask GPT for ONE step</text><text x="391.0" y="195.5" text-anchor="middle" font-size="13" fill="#5f5f66">tap · type · scroll · back</text><text x="391.0" y="212.5" text-anchor="middle" font-size="13" fill="#5f5f66">done · ask · fail</text><text x="391.0" y="229.5" text-anchor="middle" font-size="13" fill="#5f5f66">(strict JSON)</text><line x1="496" y1="195" x2="520" y2="195" stroke="#5f5f66" stroke-width="1.8" marker-end="url(#a)"/><rect x="522" y="120" width="210" height="150" rx="14" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="627.0" y="175.5" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1f">3 · Check the answer</text><text x="627.0" y="195.5" text-anchor="middle" font-size="13" fill="#5f5f66">only elements it was shown</text><text x="627.0" y="212.5" text-anchor="middle" font-size="13" fill="#5f5f66">no codes typed</text><text x="627.0" y="229.5" text-anchor="middle" font-size="13" fill="#5f5f66">invalid twice → stop</text><line x1="732" y1="195" x2="756" y2="195" stroke="#5f5f66" stroke-width="1.8" marker-end="url(#a)"/><rect x="758" y="120" width="210" height="150" rx="14" fill="#fff5f4" stroke="#f2c4bf" stroke-width="1.5"/><text x="863.0" y="175.5" text-anchor="middle" font-size="16" font-weight="700" fill="#b42318">4 · Act through the gate</text><text x="863.0" y="195.5" text-anchor="middle" font-size="13" fill="#5f5f66">same refusals, Confirm sheet</text><text x="863.0" y="212.5" text-anchor="middle" font-size="13" fill="#5f5f66">and hand-over as voice</text><text x="863.0" y="229.5" text-anchor="middle" font-size="13" fill="#5f5f66">commands</text><line x1="968" y1="195" x2="992" y2="195" stroke="#5f5f66" stroke-width="1.8" marker-end="url(#a)"/><rect x="994" y="120" width="210" height="150" rx="14" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="1099.0" y="175.5" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1f">5 · Say the step</text><text x="1099.0" y="195.5" text-anchor="middle" font-size="13" fill="#5f5f66">&quot;Typing it.&quot; &quot;Tapping</text><text x="1099.0" y="212.5" text-anchor="middle" font-size="13" fill="#5f5f66">Lofi Beats.&quot; — then</text><text x="1099.0" y="229.5" text-anchor="middle" font-size="13" fill="#5f5f66">look again</text><path d="M 1090 270 C 1090 360, 160 360, 160 272" fill="none" stroke="#5f5f66" stroke-width="1.8" marker-end="url(#a)"/><text x="625" y="350" text-anchor="middle" font-size="13" fill="#5f5f66">repeat until the job is done</text><rect x="60" y="400" width="540" height="150" rx="14" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="330.0" y="455.5" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1f">It stops when</text><text x="330.0" y="475.5" text-anchor="middle" font-size="13" fill="#5f5f66">GPT says done (video playing, note saved)</text><text x="330.0" y="492.5" text-anchor="middle" font-size="13" fill="#5f5f66">it needs your words → asks you; your answer continues the job</text><text x="330.0" y="509.5" text-anchor="middle" font-size="13" fill="#5f5f66">the same screen 3 times · 15 steps · a refusal · you say Stop</text><rect x="640" y="400" width="540" height="150" rx="14" fill="#fff5f4" stroke="#f2c4bf" stroke-width="1.5"/><text x="910.0" y="455.5" text-anchor="middle" font-size="16" font-weight="700" fill="#b42318">It never</text><text x="910.0" y="475.5" text-anchor="middle" font-size="13" fill="#5f5f66">sends a private app&#x27;s screen (WhatsApp, payments, SMS…)</text><text x="910.0" y="492.5" text-anchor="middle" font-size="13" fill="#5f5f66">presses pay / buy / order / subscribe by itself</text><text x="910.0" y="509.5" text-anchor="middle" font-size="13" fill="#5f5f66">types passwords, PINs or OTPs · leaves TalkBack off</text>
</svg>