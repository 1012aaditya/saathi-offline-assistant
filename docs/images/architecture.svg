<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Saathi architecture">
<title>Saathi architecture</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f5f66"/></marker></defs>
<rect width="1240" height="900" fill="#ffffff"/>
<text x="620.0" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1d1d1f">Saathi — how it works</text><text x="620.0" y="66" text-anchor="middle" font-size="14" fill="#5f5f66">Android app (Kotlin) · everything on the phone except the optional laptop/OpenAI bridge in demo builds</text><rect x="30" y="90" width="1180" height="130" rx="18" fill="none" stroke="#c7c7cc" stroke-dasharray="4 6"/><text x="46" y="112" font-size="12" font-weight="700" letter-spacing="1.2" fill="#5f5f66">1 · TALK</text><rect x="60" y="120" width="230" height="80" rx="14" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="175.0" y="149.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1f">You</text><text x="175.0" y="169.0" text-anchor="middle" font-size="13" fill="#5f5f66">hold Volume-down or tap</text><text x="175.0" y="186.0" text-anchor="middle" font-size="13" fill="#5f5f66">the floating bubble</text><rect x="360" y="120" width="300" height="80" rx="14" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="510.0" y="149.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1f">Floating Saathi (overlay)</text><text x="510.0" y="169.0" text-anchor="middle" font-size="13" fill="#5f5f66">bubble + panel over any app</text><text x="510.0" y="186.0" text-anchor="middle" font-size="13" fill="#5f5f66">TalkBack-friendly, voice-first</text><rect x="730" y="120" width="450" height="80" rx="14" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="955.0" y="149.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1f">Voice</text><text x="955.0" y="169.0" text-anchor="middle" font-size="13" fill="#5f5f66">listens only after Saathi stops talking (echo guard)</text><text x="955.0" y="186.0" text-anchor="middle" font-size="13" fill="#5f5f66">phone recogniser · or OpenAI speech-to-text (demo)</text><line x1="290" y1="160" x2="358" y2="160" stroke="#5f5f66" stroke-width="1.8" marker-end="url(#a)"/><line x1="660" y1="160" x2="728" y2="160" stroke="#5f5f66" stroke-width="1.8" marker-end="url(#a)"/><rect x="30" y="240" width="1180" height="130" rx="18" fill="none" stroke="#c7c7cc" stroke-dasharray="4 6"/><text x="46" y="262" font-size="12" font-weight="700" letter-spacing="1.2" fill="#5f5f66">2 · UNDERSTAND</text><rect x="60" y="270" width="360" height="80" rx="14" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="240.0" y="299.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1f">Fixed phrases (instant, offline)</text><text x="240.0" y="319.0" text-anchor="middle" font-size="13" fill="#5f5f66">&quot;cart kholo&quot;, &quot;sabse sasta&quot;, &quot;walk mode&quot;…</text><text x="240.0" y="336.0" text-anchor="middle" font-size="13" fill="#5f5f66">Hindi · Hinglish · English</text><rect x="470" y="270" width="330" height="80" rx="14" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="635.0" y="299.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1f">Free speech → GPT / Gemma</text><text x="635.0" y="319.0" text-anchor="middle" font-size="13" fill="#5f5f66">gpt-4.1-mini via laptop bridge (demo)</text><text x="635.0" y="336.0" text-anchor="middle" font-size="13" fill="#5f5f66">Gemma 3 1B on-device (newer phones)</text><rect x="850" y="270" width="330" height="80" rx="14" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="1015.0" y="299.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1f">Strict answer check</text><text x="1015.0" y="319.0" text-anchor="middle" font-size="13" fill="#5f5f66">only allowed intents; never yes / send / pay</text><text x="1015.0" y="336.0" text-anchor="middle" font-size="13" fill="#5f5f66">invalid → retry once → stop</text><line x1="955" y1="200" x2="955" y2="268" stroke="#5f5f66" stroke-width="1.8" marker-end="url(#a)"/><text x="961.0" y="228.0" font-size="12" fill="#5f5f66">text</text><line x1="420" y1="310" x2="468" y2="310" stroke="#5f5f66" stroke-width="1.8" marker-end="url(#a)"/><text x="450.0" y="304.0" font-size="12" fill="#5f5f66">no match</text><line x1="800" y1="310" x2="848" y2="310" stroke="#5f5f66" stroke-width="1.8" marker-end="url(#a)"/><rect x="30" y="390" width="1180" height="150" rx="18" fill="none" stroke="#c7c7cc" stroke-dasharray="4 6"/><text x="46" y="412" font-size="12" font-weight="700" letter-spacing="1.2" fill="#5f5f66">3 · DO</text><rect x="55" y="425" width="210" height="95" rx="14" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="160.0" y="461.5" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1f">Guide mode</text><text x="160.0" y="481.5" text-anchor="middle" font-size="13" fill="#5f5f66">describe → you say a step</text><text x="160.0" y="498.5" text-anchor="middle" font-size="13" fill="#5f5f66">→ Saathi does it</text><rect x="287" y="425" width="210" height="95" rx="14" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="392.0" y="461.5" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1f">Do it for me</text><text x="392.0" y="481.5" text-anchor="middle" font-size="13" fill="#5f5f66">GPT plans one step at a time</text><text x="392.0" y="498.5" text-anchor="middle" font-size="13" fill="#5f5f66">in any (non-private) app</text><rect x="519" y="425" width="210" height="95" rx="14" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="624.0" y="461.5" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1f">Scripted tasks</text><text x="624.0" y="481.5" text-anchor="middle" font-size="13" fill="#5f5f66">WhatsApp read / reply</text><text x="624.0" y="498.5" text-anchor="middle" font-size="13" fill="#5f5f66">Blinkit search → cart</text><rect x="751" y="425" width="210" height="95" rx="14" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="856.0" y="461.5" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1f">Walk mode</text><text x="856.0" y="481.5" text-anchor="middle" font-size="13" fill="#5f5f66">YOLOv8 on-device</text><text x="856.0" y="498.5" text-anchor="middle" font-size="13" fill="#5f5f66">voice + vibration warnings</text><rect x="983" y="425" width="210" height="95" rx="14" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="1088.0" y="461.5" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1f">Vision</text><text x="1088.0" y="481.5" text-anchor="middle" font-size="13" fill="#5f5f66">&quot;what&#x27;s in front?&quot;</text><text x="1088.0" y="498.5" text-anchor="middle" font-size="13" fill="#5f5f66">&quot;what does this picture say?&quot;</text><line x1="620" y1="350" x2="620" y2="423" stroke="#5f5f66" stroke-width="1.8" marker-end="url(#a)"/><rect x="30" y="560" width="1180" height="150" rx="18" fill="none" stroke="#c7c7cc" stroke-dasharray="4 6"/><text x="46" y="582" font-size="12" font-weight="700" letter-spacing="1.2" fill="#5f5f66">4 · SAFETY (EVERY ACTION)</text><rect x="60" y="595" width="520" height="95" rx="14" fill="#fff5f4" stroke="#f2c4bf" stroke-width="1.5"/><text x="320.0" y="623.0" text-anchor="middle" font-size="16" font-weight="700" fill="#b42318">Safety gate R1–R11 (deterministic)</text><text x="320.0" y="643.0" text-anchor="middle" font-size="13" fill="#5f5f66">send / order / pay → read-back + spoken &quot;yes&quot; (Cancel default)</text><text x="320.0" y="660.0" text-anchor="middle" font-size="13" fill="#5f5f66">never PINs, OTPs, passwords, CAPTCHAs → hand over</text><text x="320.0" y="677.0" text-anchor="middle" font-size="13" fill="#5f5f66">blocks calls, deletes, payments in WhatsApp…</text><rect x="640" y="595" width="540" height="95" rx="14" fill="#f3f2ff" stroke="#cfcbff" stroke-width="1.5"/><text x="910.0" y="623.0" text-anchor="middle" font-size="16" font-weight="700" fill="#2b22b8">Accessibility service</text><text x="910.0" y="643.0" text-anchor="middle" font-size="13" fill="#5f5f66">reads the screen (never Saathi&#x27;s own windows)</text><text x="910.0" y="660.0" text-anchor="middle" font-size="13" fill="#5f5f66">taps · types · scrolls only after the gate says yes</text><text x="910.0" y="677.0" text-anchor="middle" font-size="13" fill="#5f5f66">private apps never sent to any model</text><line x1="620" y1="540" x2="330" y2="593" stroke="#5f5f66" stroke-width="1.8" marker-end="url(#a)"/><line x1="580" y1="642" x2="638" y2="642" stroke="#5f5f66" stroke-width="1.8" marker-end="url(#a)"/><text x="615.0" y="636.0" font-size="12" fill="#5f5f66">allowed</text><rect x="30" y="730" width="1180" height="140" rx="18" fill="none" stroke="#c7c7cc" stroke-dasharray="4 6"/><text x="46" y="752" font-size="12" font-weight="700" letter-spacing="1.2" fill="#5f5f66">APPS IT WORKS IN</text><rect x="60" y="770" width="170" height="60" rx="14" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="145.0" y="806.0" text-anchor="middle" font-size="16" font-weight="500" fill="#1d1d1f">WhatsApp</text><rect x="250" y="770" width="170" height="60" rx="14" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="335.0" y="806.0" text-anchor="middle" font-size="16" font-weight="500" fill="#1d1d1f">Blinkit</text><rect x="440" y="770" width="170" height="60" rx="14" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="525.0" y="806.0" text-anchor="middle" font-size="16" font-weight="500" fill="#1d1d1f">YouTube</text><rect x="630" y="770" width="170" height="60" rx="14" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="715.0" y="806.0" text-anchor="middle" font-size="16" font-weight="500" fill="#1d1d1f">Samsung Notes</text><rect x="820" y="770" width="170" height="60" rx="14" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="905.0" y="806.0" text-anchor="middle" font-size="16" font-weight="500" fill="#1d1d1f">Camera / Photos</text><rect x="1010" y="770" width="170" height="60" rx="14" fill="#f5f5f7" stroke="#c7c7cc" stroke-width="1.5"/><text x="1095.0" y="806.0" text-anchor="middle" font-size="16" font-weight="500" fill="#1d1d1f">any app</text><line x1="910" y1="690" x2="910" y2="768" stroke="#5f5f66" stroke-width="1.8" marker-end="url(#a)"/>
</svg>