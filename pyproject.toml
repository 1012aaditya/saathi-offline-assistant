[project]
name = "saathi"
version = "0.1.0"
description = "Hindi + English voice agent that operates Android apps for blind and low-vision users."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mobilerun-core-local>=0.6.1",
    "openai>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rapidfuzz>=3.0",
    "sounddevice>=0.4",
    "pynput>=1.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saathi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
