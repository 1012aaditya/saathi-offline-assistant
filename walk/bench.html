<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saathi depth benchmark</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 16px; background: #111; color: #eee; }

  table { border-collapse: collapse; margin-top: 16px; width: 100%; }

  .ok { color: #19c99a; } .slow { color: #ffb627; } .bad { color: #ff6b6b; }
